<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Lingel QR — Site Receiving</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#13161b"><link rel="apple-touch-icon" href="icon.svg"><meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#13161b;--panel:#1b2027;--panel2:#20262f;--line:#2b333d;--ink:#eef2f6;--mut:#9aa7b4;--hv:#ffce1f;--ok:#37c871;--bad:#ff5d5d;--warn:#ff9f43}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Archivo,system-ui,sans-serif}
.mono{font-family:'JetBrains Mono',monospace}
header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#161a20,#12151a);border-bottom:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:8px;background:var(--hv);color:#111;display:grid;place-items:center;font-weight:800;overflow:hidden}
.mark img{width:100%;height:100%;object-fit:contain;background:#fff}
h1{font-size:15px;margin:0}small{color:var(--mut);font-size:11px}
.hspace{flex:1}
.iconbtn{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:8px 10px;font-size:13px;cursor:pointer;text-decoration:none}
.wrap{max-width:640px;margin:0 auto;padding:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
nav{display:flex;gap:8px;max-width:640px;margin:10px auto 0;padding:0 14px}
nav button{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:11px;font-weight:800;font-size:14px;cursor:pointer}
nav button.on{background:var(--hv);color:#111;border-color:var(--hv)}
.view{display:none}.view.on{display:block}
label.fld{display:block;margin-bottom:8px}label.fld span{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.inp{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:13px 12px;font-size:16px}
.inp.mid{text-align:center}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:12px 16px;font-weight:800;font-size:14px;cursor:pointer}
.btn.pri{background:var(--hv);color:#111;border-color:var(--hv)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:5px 10px;font-size:13px;font-weight:600}
.chip b{font-family:'JetBrains Mono',monospace}
.chip .x{cursor:pointer;color:var(--bad);font-weight:800}
#cam{width:100%;border-radius:12px;display:none;background:#000;margin-top:10px}
.result{border-radius:14px;padding:16px;text-align:center;border:1px solid var(--line);min-height:80px;display:flex;flex-direction:column;justify-content:center;gap:6px;margin-top:12px}
.result.ok{background:rgba(55,200,113,.12);border-color:var(--ok)}
.result.bad{background:rgba(255,93,93,.12);border-color:var(--bad)}
.result.warn{background:rgba(255,159,67,.12);border-color:var(--warn)}
.big{font-size:22px;font-weight:800}
.hint{font-size:12px;color:var(--mut)}.muted{color:var(--mut)}
.feed{margin-top:12px}.frow{display:flex;gap:8px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);font-size:14px}
.frow .t{margin-left:auto;font-size:11px;color:var(--mut)}
table.rep{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
table.rep th,table.rep td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
table.rep th{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.3px}
table.rep td.n{text-align:right;font-family:'JetBrains Mono',monospace}
.ordh{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:12px;display:flex;align-items:center;gap:8px}
.ordh b{font-family:'JetBrains Mono',monospace}
.ok{color:var(--ok)}.bad2{color:var(--bad)}.warn2{color:var(--warn)}
</style></head><body>
<header><div class="mark" id="mark">L</div>
<div><h1>QR · Site Receiving</h1><small>Select orders, scan what arrives</small></div>
<div class="hspace"></div>
<a class="iconbtn" href="qr-box-lookup.html" title="Box contents">📦</a>
<a class="iconbtn" href="index.html" title="Home">⌂</a></header>
<nav>
 <button data-v="scan" class="on">Receive scan</button>
 <button data-v="report">Sent vs received</button>
</nav>
<div class="wrap">
 <section class="view on" id="v-scan">
  <div class="card">
   <label class="fld"><span>Add order(s) being received</span>
    <div style="display:flex;gap:8px"><select class="inp" id="oSel"></select><button class="btn" id="oAdd">＋</button><button class="btn" id="oRef">↻</button></div></label>
   <div class="chips" id="selChips"></div>
   <div class="hint" id="selHint" style="margin-top:6px">Add the orders in this delivery. Scanning a piece from any other order will be flagged.</div>
  </div>
  <div class="card">
   <label class="fld"><span>Received by</span><input class="inp" id="recv" placeholder="Your name" autocomplete="off"></label>
   <input class="inp mono mid" id="scanInp" placeholder="Scan or type a QR code…" autocomplete="off" autocapitalize="off" spellcheck="false" style="margin-top:6px">
   <div style="margin-top:10px"><button class="btn" id="camBtn">📷 Camera scan</button></div>
   <video id="cam" playsinline muted></video>
   <div class="result" id="res"><div class="muted">Add order(s) above, then scan each piece as it comes off the truck.</div></div>
   <div class="feed" id="feed"></div>
  </div>
 </section>
 <section class="view" id="v-report">
  <div class="card">
   <div style="display:flex;gap:8px"><button class="btn pri" id="repBtn" style="flex:1">⤓ Create receiving report (PDF)</button><button class="btn" id="repView">Show</button></div>
   <div class="hint" style="margin-top:8px">Sent (dispatched) vs received, per position, for the selected orders.</div>
   <div id="repOut"></div>
  </div>
 </section>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function applyLogo(){const d=localStorage.getItem('lingel_logo');if(d)$('#mark').innerHTML='<img src="'+d+'">';}
applyLogo();
function api(){let a=localStorage.getItem('lingel_qr_api')||'';if(!a){a=(prompt('Paste the Lingel Apps Script /exec URL:')||'').trim();if(a)localStorage.setItem('lingel_qr_api',a);}return a;}
function apiSilent(){return localStorage.getItem('lingel_qr_api')||'';}
function superObj(){try{const v=localStorage.getItem('lingel_supervisor');if(!v)return null;return v.charAt(0)==='{'?JSON.parse(v):{name:v};}catch(e){return {name:String(localStorage.getItem('lingel_supervisor')||'')};}}
function superName(){const o=superObj();return o&&o.name?o.name:'';}
const APP_KEY='site',APP_NAME='Site Receiving';
function blockScreen(title,msg){document.body.innerHTML='<div style="max-width:520px;margin:56px auto;padding:24px;font-family:Archivo,system-ui,sans-serif;color:#eef2f6;background:#1b2027;border:1px solid #2b333d;border-radius:14px;text-align:center"><div style="width:44px;height:44px;border-radius:10px;background:#ffce1f;color:#111;font-weight:800;display:grid;place-items:center;margin:0 auto 12px">L</div><div style="font-size:20px;font-weight:800;margin-bottom:8px">'+title+'</div><div style="color:#9aa7b4;margin-bottom:18px;line-height:1.5">'+msg+'</div><a href="index.html" style="display:inline-block;background:#ffce1f;color:#111;font-weight:800;padding:12px 18px;border-radius:11px;text-decoration:none">\u2302 Back to hub</a></div>';}
async function accessGate(){try{
 const o=superObj();
 if(!o||!o.name){blockScreen('Please sign in','Open the factory hub and sign in, then reopen '+APP_NAME+'.');return false;}
 const u=apiSilent();
 let acc=null;try{acc=JSON.parse(localStorage.getItem('lingel_access')||'null');}catch(e){}
 const ok=a=>a&&a.name===o.name&&((a.apps||[]).indexOf('*')>=0||(a.apps||[]).indexOf(APP_KEY)>=0);
 if(!u)return true;
 if(ok(acc)){postForm(u,{action:'access',name:o.name}).then(function(r){if(r&&r.ok)localStorage.setItem('lingel_access',JSON.stringify({name:o.name,apps:r.apps||[],at:Date.now()}));}).catch(function(){});return true;}
 try{const r=await postForm(u,{action:'access',name:o.name});if(r&&r.ok){acc={name:o.name,apps:r.apps||[],at:Date.now()};localStorage.setItem('lingel_access',JSON.stringify(acc));}}catch(e){}
 if(!acc||acc.name!==o.name){if(!navigator.onLine)return true;blockScreen('Access not verified','Could not check your permissions. Connect once and reopen '+APP_NAME+'.');return false;}
 const apps=acc.apps||[];if(apps.indexOf('*')>=0||apps.indexOf(APP_KEY)>=0)return true;
 blockScreen('No access to '+APP_NAME,'You are signed in as <b>'+esc(o.name)+'</b>, which is not allowed to use '+APP_NAME+'. Ask an admin to add "'+APP_KEY+'" to your access.');return false;
}catch(err){return true;}}
async function postForm(u,params){const b=new URLSearchParams();Object.keys(params).forEach(k=>b.set(k,params[k]==null?'':params[k]));const ctl=new AbortController();const to=setTimeout(function(){ctl.abort();},12000);try{const r=await fetch(u,{method:'POST',body:b,signal:ctl.signal});return await r.json().catch(function(){return {};});}catch(e){return {};}finally{clearTimeout(to);}}
function parseCode(code){code=String(code||'').trim().toUpperCase();
 let m=code.match(/^L-(.+)-P(\d+)(?:-([A-Z]{2})(\d+))?$/);if(m)return{kind:m[3]?'part':'pos',slug:m[1],pos:+m[2],xx:m[3]||'',idx:m[4]?+m[4]:0,code};
 m=code.match(/^L-(.+)-HW(\d+)$/);if(m)return{kind:'hw',slug:m[1],idx:+m[2],code};return null;}
function beep(f){try{const a=new(window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.value=.08;o.start();setTimeout(()=>{o.stop();a.close();},110);}catch(e){}}
const PARTN={FR:'Frame',SA:'Sash',GL:'Glass',ME:'Mesh',GB:'Georgian',CP:'Coupling'};
function partName(p){if(p.kind==='hw')return 'Hardware box '+p.idx;if(p.kind==='pos')return 'Position '+p.pos;return (PARTN[p.xx]||p.xx)+' '+p.idx;}
function slugify(o){return String(o||'').toUpperCase().replace(/[^0-9A-Z]+/g,'-').replace(/^-|-$/g,'');}
function baseOffer(o){o=String(o||'').trim();var b=o.split('/')[0].trim();return b||o;}
function stamp(){var d=new Date();return d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2);}
function receiver(){return superName()||($('#recv').value||'').trim()||localStorage.getItem('lingel_receiver')||'';}
function dev(){let d=localStorage.getItem('lingel_device');if(!d){d=Math.random().toString(36).slice(2,8);localStorage.setItem('lingel_device',d);}return d;}

$('#recv').value=superName()||localStorage.getItem('lingel_receiver')||'';if(superName())$('#recv').readOnly=true;
$('#recv').onchange=()=>localStorage.setItem('lingel_receiver',receiver());

/* ---- selected orders + expected units ---- */
let sel=JSON.parse(localStorage.getItem('lingel_recv_sel')||'[]');
let slugMap={};           // slug -> offer
let expected={};          // offer -> {code:{pos,part,disp,recv}}
const done={};            // codes received this session
function saveSel(){localStorage.setItem('lingel_recv_sel',JSON.stringify(sel));}
async function loadOrders(){const u=api();if(!u)return[];let list=[];try{const r=await postForm(u,{action:'qrOrders'});list=(r&&r.orders)||[];}catch(e){}
 slugMap={};list.forEach(o=>{slugMap[slugify(o.offer)]=o.offer;});
 const s=$('#oSel');const cur=s.value;s.innerHTML='<option value="">— pick an order —</option>'+list.filter(o=>o.status==='dispatched'&&sel.indexOf(o.offer)<0).map(o=>'<option value="'+esc(o.offer)+'">'+esc(o.offer)+' — '+esc(o.customer||'')+'</option>').join('');s.value=cur;
 return list;}
async function loadExpected(off){const u=api();if(!u)return;try{const r=await postForm(u,{action:'qrStatus',offer:off});expected[off]=(r&&r.units)||{};}catch(e){expected[off]=expected[off]||{};}}
function selOffers(){return sel.slice();}
function inSel(offer){return sel.indexOf(offer)>=0;}
function renderSel(){const box=$('#selChips');box.innerHTML='';sel.forEach((off,i)=>{const c=document.createElement('span');c.className='chip';
  const u=expected[off]||{};let sent=0,recd=0;Object.keys(u).forEach(k=>{if(u[k].disp)sent++;if(u[k].recv)recd++;});
  c.innerHTML='<b>'+esc(off)+'</b> <span class="hint">'+recd+'/'+ (sent||Object.keys(u).length) +'</span> <span class="x">✕</span>';
  c.querySelector('.x').onclick=()=>{sel.splice(i,1);saveSel();renderSel();loadOrders();};box.appendChild(c);});
 $('#selHint').style.display=sel.length?'none':'block';}
async function addSel(){const off=$('#oSel').value;if(!off||inSel(off))return;sel.push(off);saveSel();$('#oSel').value='';await loadExpected(off);renderSel();loadOrders();}
$('#oAdd').onclick=addSel;$('#oRef').onclick=async()=>{await loadOrders();for(const o of sel)await loadExpected(o);renderSel();};

/* ---- receive scan with wrong-piece alert ---- */
async function receive(raw){const p=parseCode(raw),res=$('#res');
 if(!p){res.className='result bad';res.innerHTML='<div class="big">✕ Not a Lingel QR</div><div class="mono">'+esc(String(raw).slice(0,40))+'</div>';beep(220);return;}
 const offer=slugMap[p.slug]||p.slug;
 if(sel.length && !inSel(offer)){res.className='result bad';res.innerHTML='<div class="big">⚠ WRONG PIECE</div><div>'+esc(offer)+' is NOT in the selected orders</div><div class="hint">Do not unload — or add this order above.</div><div class="mono">'+p.code+'</div>';beep(200);return;}
 const who=receiver();if(!who){res.className='result warn';res.innerHTML='<div class="big">Enter your name first</div>';$('#recv').focus();beep(330);return;}
 localStorage.setItem('lingel_receiver',who);
 if(done[p.code]){res.className='result warn';res.innerHTML='<div class="big">Already received ✓</div><div>'+esc(offer)+' · '+esc(partName(p))+'</div><div class="mono">'+p.code+'</div>';beep(330);return;}
 const u=api();if(!u){res.className='result bad';res.innerHTML='<div class="big">No server URL set</div>';return;}
 res.className='result';res.innerHTML='<div class="muted">Recording '+esc(partName(p))+'…</div>';
 const r=await postForm(u,{action:'qrScan',code:p.code,stage:'recv',result:'received',supervisor:who,device:dev()});
 if(r&&r.ok){done[p.code]=1;if(expected[offer]&&expected[offer][p.code])expected[offer][p.code].recv=true;else if(expected[offer])expected[offer][p.code]={pos:p.kind==='hw'?'':('P'+('0'+p.pos).slice(-2)),part:partName(p),disp:false,recv:true};
   res.className='result ok';res.innerHTML='<div class="big">✅ Received</div><div>'+esc(offer)+' · '+esc(partName(p))+'</div><div class="mono">'+p.code+'</div>';beep(660);addFeed(offer,partName(p));renderSel();}
 else{res.className='result bad';res.innerHTML='<div class="big">Save failed</div><div class="hint">Check your connection and scan again.</div>';beep(220);}}
function addFeed(offer,name){const f=$('#feed');const row=document.createElement('div');row.className='frow';row.innerHTML='<span>✅</span><span>'+esc(offer)+' · '+esc(name)+'</span><span class="t">'+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'</span>';f.insertBefore(row,f.firstChild);}
$('#scanInp').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();receive($('#scanInp').value);$('#scanInp').value='';}});

/* ---- sent vs received report ---- */
function reportRows(off){const u=expected[off]||{};const grp={};
 Object.keys(u).forEach(c=>{const x=u[c];const pos=(x.pos&&String(x.pos).trim())||'Hardware boxes';
  (grp[pos]||(grp[pos]={made:0,sent:0,recd:0}));grp[pos].made++;if(x.disp)grp[pos].sent++;if(x.recv)grp[pos].recd++;});
 return grp;}
function statusOf(g){const base=g.sent||g.made;if(g.recd>=base&&base>0)return{t:'OK',c:'ok'};if(g.recd<base)return{t:(base-g.recd)+' short',c:'bad2'};return{t:'—',c:'warn2'};}
async function refreshAll(){for(const o of sel)await loadExpected(o);}
function renderReport(){const out=$('#repOut');if(!sel.length){out.innerHTML='<div class="hint" style="margin-top:10px">Add order(s) on the Receive scan tab first.</div>';return;}
 let html='';sel.forEach(off=>{const grp=reportRows(off);let sent=0,recd=0,made=0;Object.keys(grp).forEach(k=>{sent+=grp[k].sent;recd+=grp[k].recd;made+=grp[k].made;});
  html+='<div class="ordh"><b>'+esc(off)+'</b><span class="hint">received '+recd+' / sent '+(sent||made)+'</span></div>';
  html+='<table class="rep"><tr><th>Position</th><th style="text-align:right">Made</th><th style="text-align:right">Sent</th><th style="text-align:right">Recd</th><th>Status</th></tr>';
  Object.keys(grp).sort().forEach(pos=>{const g=grp[pos],st=statusOf(g);html+='<tr><td>'+esc(pos)+'</td><td class="n">'+g.made+'</td><td class="n">'+g.sent+'</td><td class="n">'+g.recd+'</td><td class="'+st.c+'">'+st.t+'</td></tr>';});
  html+='</table>';});
 out.innerHTML=html;}
$('#repView').onclick=async()=>{$('#repOut').innerHTML='<div class="hint" style="margin-top:10px">Loading…</div>';await refreshAll();renderReport();};
function buildRecvDoc(offers){const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});const P=14,W=210;let y=18;
 doc.setFillColor(15,18,22);doc.rect(0,0,W,20,'F');
 const logo=localStorage.getItem('lingel_logo');if(logo){try{doc.addImage(logo,'JPEG',P,3,14,14);}catch(e){}}
 doc.setFont('helvetica','bold');doc.setFontSize(15);doc.setTextColor(255,255,255);doc.text('SITE RECEIVING REPORT',logo?P+18:P,12);
 doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(150,158,168);doc.text(new Date().toLocaleString(),W-P,12,{align:'right'});
 y=27;doc.setTextColor(0);doc.setFontSize(9);doc.text('Received by: '+(receiver()||'-')+'    Orders: '+offers.length,P,y);y+=7;
 offers.forEach(off=>{const grp=reportRows(off);let sent=0,recd=0,made=0;Object.keys(grp).forEach(k=>{sent+=grp[k].sent;recd+=grp[k].recd;made+=grp[k].made;});
  if(y>262){doc.addPage();y=16;}
  doc.setFillColor(27,32,40);doc.roundedRect(P,y-4,W-2*P,6.4,1.4,1.4,'F');doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(9);doc.text(off,P+3,y);
  if(recd>=(sent||made)&&(sent||made)>0)doc.setTextColor(55,200,113);else doc.setTextColor(255,180,60);doc.text('received '+recd+' / sent '+(sent||made),W-P-3,y,{align:'right'});y+=7;doc.setTextColor(0);doc.setFont('helvetica','normal');
  const heads=['Position','Made','Sent','Recd','Status'],ws=[86,24,24,24,24];
  doc.setFillColor(230,232,236);doc.rect(P,y-3.4,W-2*P,5,'F');doc.setFont('helvetica','bold');doc.setFontSize(7.4);let x=P;heads.forEach((h,i)=>{doc.text(h,x+1.5,y);x+=ws[i];});y+=4.4;doc.setFont('helvetica','normal');
  Object.keys(grp).sort().forEach(pos=>{const g=grp[pos],st=statusOf(g);if(y>288){doc.addPage();y=16;}x=P;doc.setFontSize(7.3);doc.setTextColor(20,24,30);
    let t=pos;while(doc.getTextWidth(t)>ws[0]-3)t=t.slice(0,-1);doc.text(t,x+1.5,y);x+=ws[0];
    [g.made,g.sent,g.recd].forEach(v=>{doc.text(String(v),x+1.5,y);x+=ws[1];});
    if(st.c==='ok')doc.setTextColor(0,150,0);else if(st.c==='bad2')doc.setTextColor(200,0,0);else doc.setTextColor(200,140,0);doc.text(st.t,x+1.5,y);
    doc.setDrawColor(222,226,230);doc.setLineWidth(0.12);doc.line(P,y+1.4,W-P,y+1.4);y+=5;});
  y+=4;});
 doc.setDrawColor(222,226,230);doc.setLineWidth(0.2);doc.line(P,289,W-P,289);doc.setFontSize(7);doc.setTextColor(150,158,168);doc.text('Lingel Windows & Doors  \u00b7  Site receiving  \u00b7  '+new Date().toLocaleString(),P,292.5);
 return doc;}
async function makeReport(){if(!sel.length){alert('Add at least one order on the Receive scan tab.');return;}
 if(!(window.jspdf&&window.jspdf.jsPDF)){alert('PDF library still loading, try again.');return;}
 await refreshAll();
 buildRecvDoc(sel).save('Receiving_'+slugify(sel[0])+'_'+stamp()+(sel.length>1?'_all':'')+'.pdf'); // operator's combined copy
 const u=apiSilent();const logRows=[];
 for(const off of sel){const grp=reportRows(off);let sent=0,recd=0,made=0;Object.keys(grp).forEach(k=>{sent+=grp[k].sent;recd+=grp[k].recd;made+=grp[k].made;});
  let url='';
  if(u){try{const doc=buildRecvDoc([off]);const uri=doc.output('datauristring'),data=uri.slice(uri.indexOf(',')+1);
    const rr=await postForm(u,{action:'upload',folder:baseOffer(off),name:'Receiving_'+slugify(off)+'_'+stamp()+'.pdf',mime:'application/pdf',base64:data});if(rr&&rr.url)url=rr.url;}catch(e){}}
  logRows.push({offer:off,made:made,sent:sent,recd:recd,receiver:receiver(),url:url});}
 if(u){try{await postForm(u,{action:'recvReport',rows:JSON.stringify(logRows),receiver:receiver()});}catch(e){}}
 renderReport();}
$('#repBtn').onclick=makeReport;

/* nav + camera */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
 const v=b.getAttribute('data-v');document.querySelectorAll('.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));
 if(v==='report'){$('#repView').onclick();}if(v==='scan')setTimeout(()=>$('#scanInp').focus(),80);});
let stream=null,raf=null,det=null,last='',lastT=0;
$('#camBtn').onclick=async()=>{const v=$('#cam');if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;cancelAnimationFrame(raf);v.style.display='none';$('#camBtn').textContent='📷 Camera scan';return;}
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=stream;v.style.display='block';await v.play();$('#camBtn').textContent='■ Stop camera';if('BarcodeDetector'in window)det=new BarcodeDetector({formats:['qr_code']});loop();}
 catch(e){const r=$('#res');r.className='result bad';r.innerHTML='<div class="big">Camera blocked</div><div class="hint">Allow camera or use a USB scanner.</div>';}};
async function loop(){const v=$('#cam');if(!stream)return;
 try{let code=null;if(det){const b=await det.detect(v);if(b.length)code=b[0].rawValue;}
  else{const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;if(c.width){const x=c.getContext('2d');x.drawImage(v,0,0);const img=x.getImageData(0,0,c.width,c.height),q=jsQR(img.data,c.width,c.height);if(q)code=q.data;}}
  if(code){const now=Date.now();if(code!==last||now-lastT>1500){last=code;lastT=now;receive(code);}}}catch(e){}
 raf=requestAnimationFrame(loop);}
/* boot */
(async()=>{if(!(await accessGate()))return;await loadOrders();for(const o of sel)await loadExpected(o);renderSel();setTimeout(()=>$('#scanInp').focus(),200);})();
</script>
